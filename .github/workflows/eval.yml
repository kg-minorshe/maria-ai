name: LLM evaluation

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scenario and regression suite
        run: python scripts/run_llm_eval.py --ci

      - name: Publish evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: reports
